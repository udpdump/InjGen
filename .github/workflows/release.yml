name: Build and Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build InjGen
        run: cmake --build build --config Release

      - name: Prepare binary
        run: |
          cp build/InjGen InjGen-linux-x86_64
          chmod +x InjGen-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: injgen-linux
          path: InjGen-linux-x86_64

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: msbuild "Client Detector.sln" /p:Configuration=Release /p:Platform=x64

      - name: Prepare binary
        shell: pwsh
        run: |
          Copy-Item "x64\Release\InjGen.exe" -Destination "InjGen-windows-x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: injgen-windows
          path: InjGen-windows-x64.exe

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: artifacts
        run: |
          sha256sum InjGen-linux-x86_64 InjGen-windows-x64.exe > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/InjGen-linux-x86_64
            artifacts/InjGen-windows-x64.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
